name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # `dart format --set-exit-if-changed` is not run: the code base is not
      # formatted with `dart format` yet, and reformatting it is a separate change.
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run
