name: hotlayout_flutter_example
description: "The HotLayout quickstart: a published screen drawn by hotlayout_flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  hotlayout_flutter:
    path: ../
  # Only for `AuthorizedTransport` in lib/recipes.dart: a transport over your
  # own HTTP client. The quickstart itself does not need it.
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The bundled copies: what the app shows before, and without, the network.
  assets:
    - assets/hotlayout/document.json
    - assets/hotlayout/theme.json
